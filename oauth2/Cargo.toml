[package]
name = "oauth2"
authors = ["Alex Crichton <alex@alexcrichton.com>", "Florin Lipan <florinlipan@gmail.com>", "David A. Ramos <ramos@cs.stanford.edu>"]
version = "5.1.0"
license = "MIT OR Apache-2.0"
description = "An extensible, strongly-typed implementation of OAuth2"
repository = "https://github.com/ramosbugs/oauth2-rs"
edition = "2021"
readme = "../README.md"
rust-version = "1.71"

[package.metadata.docs.rs]
all-features = true

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["reqwest", "rustls-tls"]
pkce-plain = []
native-tls = ["reqwest/native-tls"]
reqwest-blocking = ["reqwest/blocking"]
rustls-tls = ["reqwest/rustls"]
timing-resistant-secret-traits = []

[[example]]
name = "github"
required-features = ["reqwest-blocking"]

[[example]]
name = "google"
required-features = ["reqwest-blocking"]

[[example]]
name = "google_devicecode"
required-features = ["reqwest-blocking"]

[[example]]
name = "letterboxd"
required-features = ["reqwest-blocking"]

[[example]]
name = "msgraph"
required-features = ["reqwest-blocking"]

[[example]]
name = "wunderlist"
required-features = ["reqwest-blocking"]

[dependencies]
base64 = ">= 0.23.1, <0.24"
thiserror = "1.0.69"
http = "1.5.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "2.12.1", optional = true }
url = { version = "2.5.8", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std", "wasmbind"] }
serde_path_to_error = "0.1.20"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
curl = { version = "0.4.50", optional = true }

[dev-dependencies]
hex = "=0.4.3"
hmac = "=0.12.1"
uuid = { version = "=1.25.0", features = ["v4"] }
anyhow = "=1.0.104"
tokio = { version = "=1.53.1", features = ["full"] }
oauth2-reqwest = { path = "../oauth2-reqwest" }
